name: Build KernelSU Manager APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches: [ main ]
    paths:
      - 'kernel/KernelSU/manager/**'
      - '.github/workflows/build-manager-apk.yml'

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  MANAGER_DIR: kernel/KernelSU/manager
  JAVA_VERSION: '21'
  BUILD_TOOLS_VERSION: '36.1.0'
  COMPILE_SDK: '37'
  NDK_VERSION: '29.0.14206865'

jobs:
  build-apk:
    name: Build Manager APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}"
          "$SDKMANAGER" --list_installed || true

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('kernel/KernelSU/manager/**/*.gradle.kts', 'kernel/KernelSU/manager/gradle/wrapper/gradle-wrapper.properties', 'kernel/KernelSU/manager/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate signing keystore
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/key.jks" \
            -storetype JKS \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Resolve build type
        id: bt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BT="${{ github.event.inputs.build_type }}"
          else
            BT="Release"
          fi
          echo "build_type=$BT" >> "$GITHUB_OUTPUT"
          if [ "$BT" = "Debug" ]; then
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: ${{ env.MANAGER_DIR }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace \
            -PKEYSTORE_FILE="$GITHUB_WORKSPACE/key.jks" \
            -PKEYSTORE_PASSWORD=android \
            -PKEY_ALIAS=androiddebugkey \
            -PKEY_PASSWORD=android \
            ${{ steps.bt.outputs.task }}

      - name: Collect APKs
        run: |
          set -e
          mkdir -p out
          find "$MANAGER_DIR/app/build/outputs/apk" -name '*.apk' -exec cp -v {} out/ \;
          ls -al out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-${{ steps.bt.outputs.build_type }}-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
